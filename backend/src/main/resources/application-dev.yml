spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:192.168.22.111}:${DB_PORT:5432}/${DB_NAME:moca-test-db}
    username: ${DB_USER:duylong}
    password: ${DB_PASSWORD:duylongadminpass}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    

redis:
  enabled: ${REDIS_ENABLED:true}
  host: ${REDIS_HOST:127.0.0.1}
  port: ${REDIS_PORT:16379}
  password: ${REDIS_PASSWORD:}
  ssl: ${REDIS_SSL:false}

minio:
  enabled: ${MINIO_ENABLED:false}

whisper:
  enabled: ${WHISPER_ENABLED:false}
  provider: ${WHISPER_PROVIDER:openai}
  base-url: ${WHISPER_BASE_URL:https://api.openai.com/v1}
  api-key: ${WHISPER_API_KEY:}
  model: ${WHISPER_MODEL:whisper-1}
  language: ${WHISPER_LANGUAGE:vi}
  timeout-ms: ${WHISPER_TIMEOUT_MS:60000}

# Local dev only — skip JWT; never enable in prod.
security:
  dev-bypass-auth: true
