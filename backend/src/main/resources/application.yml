spring:
  application:
    name: moca-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:moca_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:duylongadminpass}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migration: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

redis:
  enabled: ${REDIS_ENABLED:false}
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  ssl: ${REDIS_SSL:false}

minio:
  enabled: ${MINIO_ENABLED:false}

# OpenAPI 3 docs (springdoc) — /swagger-ui.html, /v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  default-flat-param-object: false

# Whisper ASR — section 5 AI assist (see backend/.env.example)
whisper:
  enabled: ${WHISPER_ENABLED:false}
  provider: ${WHISPER_PROVIDER:openai}
  base-url: ${WHISPER_BASE_URL:https://api.openai.com/v1}
  api-key: ${WHISPER_API_KEY:}
  model: ${WHISPER_MODEL:whisper-1}
  language: ${WHISPER_LANGUAGE:vi}
  timeout-ms: ${WHISPER_TIMEOUT_MS:60000}